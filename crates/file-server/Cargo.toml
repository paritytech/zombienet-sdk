[package]
name = "zombienet-file-server"
authors.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Fetches a URL into the server (`PUT`). Not the workspace's: this binary is
# built on musl (see the Dockerfile), so rustls rather than native TLS.
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "stream"] }

[dev-dependencies]
tempfile = { workspace = true }
