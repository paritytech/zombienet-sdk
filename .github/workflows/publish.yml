name: Publish to crates.io

on:
  workflow_call:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  publish:
    name: Package & publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev build-essential

      # Packages (and build-verifies) the crates in YOUR CI.
      # Use `-p <crate>` flags or `--exclude` to control which
      # workspace members get packaged.
      - name: Cargo package
        run: |
          cargo package \
            -p zombienet-support \
            -p zombienet-prom-metrics-parser \
            -p zombienet-configuration \
            -p zombienet-provider \
            -p zombienet-orchestrator \
            -p zombienet-sdk \
            -p zombie-cli

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: crates
          path: target/package/*.crate
          override: true

      - name: Generate content write token
        id: generate-content-write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CRATES_NPM_PUBLISHING_APP_CLIENT_ID }}
          private-key: ${{ secrets.CRATES_NPM_PUBLISHING_APP_PRIVATE_KEY }}
          owner: paritytech

      - name: Trigger publishing in the crates_publish_automation repo
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae #v3.0.0
        with:
          route: POST /repos/paritytech/crates_publish_automation/actions/workflows/publish.yml/dispatches
          ref: main
          inputs: '${{ format(''{{ "repo": "{0}", "run_id": "{1}" }}'', github.repository, github.run_id) }}'
        env:
          GITHUB_TOKEN: ${{steps.generate-content-write-token.outputs.token }}
