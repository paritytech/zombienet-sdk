# A custom process running a script injected from the repository: the file is
# in place before the process starts, at `/opt/greet.sh` on every provider.
# Written for native, as the other custom process configs are; docker and
# kubernetes need an `image` on the process.
#
#   zombie-cli spawn -p native crates/examples/examples/configs/custom_process_injected_files.toml

[settings]
timeout = 1000

[relaychain]
chain = "rococo-local"
command = "polkadot"

  [[relaychain.nodes]]
  name = "alice"

  [[relaychain.nodes]]
  name = "bob"

[[custom_processes]]
name = "greeter"
command = "sh"
args = ["/opt/greet.sh", "{{ZOMBIE:alice:ws_uri}}"]
injected_files = [{ local_path = "../../scripts/greet.sh", remote_path = "/opt/greet.sh", mode = "0755" }]
one_shot = true
